name: mite
version: 1.2.0
authors:
  - Mite Contributors
description: >-
  Open-source mesh curvature analysis, form-finding and gridshell toolkit.
  Principal, Gaussian, and mean curvature; curvature streamlines, umbilics
  and isocurves. Planarization, minimal surfaces, force density method and
  dynamic relaxation on a fast sparse solver. Asymptotic, geodesic, Chebyshev
  and conjugate nets with evenly-spaced auto-seeding, plus shortest geodesic
  paths. Lath buildability analysis with bending and twist strain checks and
  frame analysis of the whole network. Turn nets into buildable gridshells:
  sweep laths with rectangular profiles (flat or upright), cut half-lap or
  egg-crate joints at every crossing, unroll flat cutting patterns, segment to
  stock lengths with splice joints, label laths and export the net topology.
  Mesh healing, pull-to-mesh and one-step colour maps.
url: https://github.com/jikempff/Mite
