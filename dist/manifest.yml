  - curvature
  - form-finding
  - principal-curvature
  - gaussian-curvature
  - streamlines
  - planarization
  - minimal-surface
  - force-density
  - computational-design
  - gridshell
  - asymptotic
  - geodesic
  - lath
  - buildability
