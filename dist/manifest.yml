name: mite
version: 1.0.3
authors:
  - Mite Contributors
description: >-
  Open-source mesh curvature analysis and form-finding toolkit.
  Principal, Gaussian, and mean curvature. Curvature streamlines.
  Planarization, minimal surfaces, and force density method.
  Asymptotic, geodesic, and Chebyshev nets for gridshell design
  with evenly-spaced auto-seeding.
  Lath buildability analysis with bending and twist strain checks.
  Fabrication output: lath strip sweeps and net joint notches.
url: https://github.com/jikempff/Mite
keywords:
  - mesh
  - curvature
  - form-finding
  - principal-curvature
  - gaussian-curvature
  - streamlines
  - planarization
  - minimal-surface
  - force-density
  - computational-design
  - gridshell
  - asymptotic
  - geodesic
  - lath
  - buildability
  - fabrication
  - chebyshev
  - elastic-gridshell
