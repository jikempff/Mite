name: mite
version: 1.6.0
authors:
  - Mite Contributors
description: >-
  Open-source mesh curvature analysis, form-finding and gridshell toolkit, tested
  against exact geometry. Principal, Gaussian and mean curvature, streamlines,
  umbilics and isocurves. Planarization (guided projection), minimal surfaces,
  force density and dynamic relaxation with elastic laths on a fast sparse
  solver. Asymptotic, geodesic, Chebyshev and conjugate nets with even spacing,
  guide curves and trimming; Schling's symmetric asymptotic webs, AAG and AGG
  webs of straight flat slats, tri-hex webs and webs grown from a boundary strip.
  Buildability: lath strain checks and a beam-frame analysis of the whole net with
  per-family sections, stacked layers and linear buckling. Fabrication: one
  profile per family swept and checked, half-lap, egg-crate and threaded joints,
  unrolled strips, stock lengths packed on boards, labels, net topology and a
  flat kit with nested sheets and laser-cut hub plates. Kinetics: Net Kinetics
  moves a scissor-jointed net as a mechanism (press flat, deploy, cables),
  Kinetic Supports and Kinetic Drivers set it up as one wire each, Mechanism
  Modes shows how a net can move before you drive it, Kinetic State reads any
  moment of the motion. Mesh cleanup, pull-to-mesh and colour maps
  with legends.
url: https://github.com/jikempff/Mite
